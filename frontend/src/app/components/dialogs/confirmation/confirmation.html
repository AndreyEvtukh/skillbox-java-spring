<section
  class="bg-dark-2 flex flex-col items-center h-full overflow-hidden rounded-md border border-dark-3 justify-center text-dark-9">
  <div class="flex flex-col items-center justify-center w-full p-8">
    <div class="w-16 h-16 aspect-square rounded-full flex flex-col justify-center items-center">
      <mat-icon [svgIcon]="ICONS.QUESTION" class="color-green"></mat-icon>
    </div>

    <h2 class="uppercase font-medium">{{ config().title }}</h2>
    <div class="font-light text-14 mt-4">{{ config().message }}</div>
  </div>

  <hr class="w-full text-dark-4"/>

  <mat-dialog-actions align="end" class="relative w-full flex flex-row justify-center gap-4 ">
    <button matButton="filled"
            class="cursor-pointer !w-1/3 rounded-sm p-2 border border-dark-4 hover:bg-dark-3 transition-all duration-200"
            (click)="close()">
      <span class="text-14">{{ config().cancel }}</span>
    </button>

    <button matButton="filled"
            class="relative uppercase !w-1/3 w-full rounded-sm p-2 font-medium hover:bg-green-hover cursor-pointer transition-all duration-200
                       bg-green text-dark-2 border-green border"
            (click)="confirm()">
      <span class="text-14 font-medium">{{ config().confirm }}</span>
    </button>

  </mat-dialog-actions>
</section>
